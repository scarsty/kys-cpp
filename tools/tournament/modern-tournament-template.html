<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>金群自走棋 · 賽事戰報</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f8;--surface:#fff;--soft:#eef2f4;--ink:#182830;--muted:#62737b;--line:#dde5e8;--accent:#007b68;--accent-soft:#dff3ee;--amber:#986111;--amber-soft:#fff0d1;--blue:#3563ad;--blue-soft:#e8effb;--violet:#7a4ea4;--violet-soft:#f0e8f8;--loss:#7e5960;--shadow:0 12px 40px #203c4910}
@media(prefers-color-scheme:dark){:root{--bg:#101a20;--surface:#17252c;--soft:#20323b;--ink:#edf4f6;--muted:#a0b4be;--line:#30454f;--accent:#70ddbe;--accent-soft:#193e35;--amber:#edc479;--amber-soft:#3d321e;--blue:#a0bfff;--blue-soft:#223450;--violet:#c9a6ec;--violet-soft:#342a44;--loss:#d7a4b1;--shadow:0 12px 40px #0002}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI","Microsoft JhengHei",sans-serif;line-height:1.55}button,input,select{font:inherit}button,a,select{-webkit-tap-highlight-color:transparent}a{color:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.wrap{max-width:1300px;margin:auto;padding:0 40px 48px}.topbar{display:flex;justify-content:space-between;align-items:center;padding:26px 0;border-bottom:1px solid var(--line);gap:20px}.brand{display:flex;align-items:center;gap:12px;font-weight:650;text-decoration:none}.brand-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--ink);color:var(--bg)}.brand small{color:var(--muted);font-size:11px;letter-spacing:.12em;display:block}nav{display:flex;gap:24px;font-size:14px}nav a{text-decoration:none;color:var(--muted)}nav a:hover{color:var(--accent)}.hero{padding:52px 0 32px;display:flex;justify-content:space-between;gap:24px;align-items:flex-end}.eyebrow{color:var(--accent);letter-spacing:.14em;font-size:12px;font-weight:650;margin:0 0 16px}h1{font-size:clamp(30px,5vw,56px);line-height:1.15;letter-spacing:-.035em;margin:0;font-weight:650}.subtitle{color:var(--muted);margin:18px 0 0;font-size:14px}.seed{text-align:right;color:var(--muted);font-size:12px}.seed code{display:block;color:var(--ink);margin-top:8px;font-size:13px}.numbers{display:grid;grid-template-columns:repeat(4,1fr);margin:0 0 32px;border-bottom:1px solid var(--line)}.number{padding:14px 0 24px}.number span{color:var(--muted);display:block;font-size:13px}.number strong{font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.03em}.number small{margin-left:8px;color:var(--muted)}
.podium{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:16px;margin-bottom:46px}.podium-card{padding:24px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0;border:1px solid var(--line)}.podium-card:first-child{border-color:var(--accent);background:linear-gradient(135deg,var(--accent-soft),var(--surface) 72%)}.podium-top{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px}.podium-name{font-size:20px;line-height:1.45;font-weight:600;overflow-wrap:anywhere}.podium-bottom{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--muted);margin-top:auto}.talent{display:inline-flex;align-items:center;white-space:nowrap;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft)}.talent[data-talent="divine_arms"]{color:var(--amber);background:var(--amber-soft)}.talent[data-talent="backbone"]{color:var(--blue);background:var(--blue-soft)}.talent[data-talent="late_bloomer"]{color:var(--violet);background:var(--violet-soft)}
.section{scroll-margin-top:24px;margin-bottom:44px}.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:20px}h2{font-size:23px;letter-spacing:-.02em;margin:0;font-weight:600}.section-title small{color:var(--muted);font-size:13px}.toolbar{display:grid;grid-template-columns:minmax(200px,1fr) 150px 180px;gap:12px;margin-bottom:18px}label{display:grid;gap:8px;color:var(--muted);font-size:12px}input,select{width:100%;min-width:0;padding:11px 13px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:var(--surface);font-size:14px}input::placeholder{color:var(--muted)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}table{width:100%;border-collapse:collapse;font-size:14px}th{font-size:11px;color:var(--muted);font-weight:600;padding:14px 17px;text-align:left;background:var(--soft);white-space:nowrap;letter-spacing:.04em}td{padding:14px 17px;border-top:1px solid var(--line)}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.rank{color:var(--muted);width:64px}tr.top-three .rank{font-weight:650;color:var(--accent)}.name{min-width:185px;font-weight:500}.choose{background:none;border:0;padding:0;color:var(--ink);text-align:left}.choose:hover{color:var(--accent)}.bar{height:4px;margin-top:7px;background:var(--soft);border-radius:3px;overflow:hidden;min-width:75px}.bar>span{display:block;height:100%;background:var(--accent);border-radius:3px}
.versus-controls{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:18px}.comparison{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:20px}.compare-team{min-width:0}.compare-team:last-child{text-align:right}.compare-name{font-size:19px;font-weight:600;overflow-wrap:anywhere;margin:10px 0 6px}.compare-meta{color:var(--muted);font-size:13px}.score{text-align:center;white-space:nowrap;font-size:44px;line-height:1.2;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.score small{display:block;color:var(--muted);font-size:11px;letter-spacing:.05em;font-weight:400;margin-top:8px}.seed-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.seed-card{background:var(--surface);border-radius:14px;border:1px solid var(--line);overflow:hidden}.seed-card-header{padding:18px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line)}.seed-card-header span{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}.battle{border-bottom:1px solid var(--line)}.battle:last-child{border:0}summary{list-style:none;cursor:pointer;padding:17px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center}summary::-webkit-details-marker{display:none}.battle-info{color:var(--muted);font-size:12px}.battle-info strong{display:block;color:var(--ink);font-weight:500;font-size:13px;margin-bottom:3px}.result{color:var(--accent);font-size:13px;font-weight:600;white-space:nowrap}.result.loss{color:var(--loss)}.battle-body{padding:0 20px 18px;font-size:12px}.digest{overflow-wrap:anywhere;color:var(--muted);font-size:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);color:var(--ink);border-radius:7px;padding:12px;font-size:11px;margin:12px 0}.copy{background:var(--soft);color:var(--ink);border:0;border-radius:7px;padding:8px 12px;font-size:12px}.copy:hover{background:var(--accent-soft)}.status{min-height:22px;font-size:12px;color:var(--accent);margin-top:12px}footer{border-top:1px solid var(--line);padding-top:24px;display:flex;justify-content:space-between;gap:20px;font-size:12px;color:var(--muted);flex-wrap:wrap}footer span{overflow-wrap:anywhere;max-width:100%}.empty{color:var(--muted);padding:24px;text-align:center}
.opponent-overview{margin-bottom:28px}.opponent-overview .table-wrap{max-height:520px}.opponent-overview th{position:sticky;top:0;z-index:1}.selected-opponent{background:var(--accent-soft)}h3{font-size:17px;margin:0;font-weight:600}.match-details{scroll-margin-top:24px}
@media(max-width:900px){.wrap{padding:0 24px 32px}.podium{grid-template-columns:1fr 1fr}.podium-card:first-child{grid-column:1/-1}.seed-grid{grid-template-columns:1fr}.hero{align-items:flex-start}.seed{max-width:160px}}
@media(max-width:560px){.wrap{padding:0 16px 28px}.brand{font-size:13px}nav{gap:16px;font-size:12px}.hero{padding-top:32px;flex-direction:column;gap:20px}.seed{text-align:left;max-width:none}.seed code{display:inline;margin-left:8px}.numbers{grid-template-columns:1fr 1fr}.number{padding:12px 0}.number strong{font-size:28px}.podium{grid-template-columns:1fr;gap:12px;margin-bottom:32px}.podium-card{padding:20px}.toolbar{grid-template-columns:1fr 1fr}.toolbar>label:first-child{grid-column:1/-1}.versus-controls{grid-template-columns:1fr;gap:12px}.comparison{grid-template-columns:1fr;gap:20px;text-align:left;padding:22px}.compare-team:last-child{text-align:left}.score{font-size:36px;text-align:left}.score small{display:inline;margin-left:14px}.section-title{align-items:flex-start;flex-direction:column;gap:8px}td,th{padding:12px}}
</style>
</head>
<body>
<main class="wrap">
<header class="topbar"><a class="brand" href="#"><span class="brand-mark">棋</span><span>金群自走棋<small>TOURNAMENT REPORT</small></span></a><nav aria-label="報告導覽"><a href="#standings">完整排名</a><a href="#matchups">對戰分析</a></nav></header>
<section class="hero"><div><p class="eyebrow" id="versionLabel"></p><h1>賽事戰報</h1><p class="subtitle" id="formatLabel"></p></div><div class="seed">賽事根種子<code id="rootSeed"></code></div></section>
<section class="numbers" aria-label="賽事統計"><div class="number"><span>參賽陣容</span><strong id="entrantCount"></strong><small>份</small></div><div class="number"><span>對戰配對</span><strong id="pairingCount"></strong><small>組</small></div><div class="number"><span>完成戰鬥</span><strong id="battleCount"></strong><small>場</small></div><div class="number"><span>每份陣容</span><strong id="perEntrant"></strong><small>場</small></div></section>
<section class="podium" id="podium" aria-label="前三名"></section>
<section class="section" id="standings"><div class="section-title"><h2>完整排名</h2><small id="rowCount" aria-live="polite"></small></div><div class="toolbar"><label>搜尋陣容<input id="search" type="search" placeholder="輸入陣容名稱"></label><label>棋手天賦<select id="talentFilter"><option value="all">全部天賦</option></select></label><label>排序<select id="sort"><option value="rank">名次</option><option value="name">陣容名稱</option><option value="losses">敗場由少至多</option></select></label></div><div class="table-wrap"><table><thead><tr><th>名次</th><th>陣容</th><th>天賦</th><th class="num">總分</th><th class="num">勝</th><th class="num">敗</th><th class="num">勝率</th></tr></thead><tbody id="standingRows"></tbody></table></div></section>
<section class="section" id="matchups"><div class="section-title"><h2>對戰分析</h2><small>選擇陣容，查看與全部對手的結果。</small></div><div class="versus-controls"><label>A · 參賽陣容<select id="entrantA"></select></label><label>B · 對手陣容<select id="entrantB"></select></label></div><div class="opponent-overview"><div class="section-title"><h3 id="opponentTitle"></h3><small id="opponentSummary" aria-live="polite"></small></div><div class="table-wrap" tabindex="0" role="region" aria-labelledby="opponentTitle"><table><thead><tr><th>對手名次</th><th>對手陣容</th><th>天賦</th><th class="num">積分 A : 對手</th><th class="num">A 勝</th><th class="num">和</th><th class="num">A 敗</th><th class="num">A 勝率</th></tr></thead><tbody id="opponentRows"></tbody></table></div></div><div class="match-details" id="matchDetails"><div class="section-title"><h3>單組對戰詳情</h3><small>點開單場紀錄，可檢視驗證碼與重現指令。</small></div><div class="comparison" id="comparison" aria-live="polite"></div><div class="seed-grid" id="seedCards"></div><div class="status" id="copyStatus" role="status"></div></div></section>
<footer><span id="footerVersion"></span><span id="rulesLabel"></span><span id="sourceLabel"></span></footer>
</main>
<script>
const DATA = __TOURNAMENT_DATA__;
const el = id => document.getElementById(id);
const escapeHtml = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const submissions = new Map(DATA.submissions.map(([index,name,source,hash,talent,talentId]) => [index,{index,name,source,hash,talent,talentId}]));
const standings = DATA.standings.map(([rank,index,halfPoints,points,wins,draws,losses]) => ({rank,index,halfPoints,points,wins,draws,losses}));
const standingMap = new Map(standings.map(s => [s.index,s]));
const pairings = new Map(DATA.pairings.map((p,i) => [`${p[0]}:${p[1]}`,{index:i,first:p[0],second:p[1],firstPoints:p[2]/2,secondPoints:p[3]/2,battles:[]}]));
const pairingByIndex = [...pairings.values()];
const battles = DATA.battles.map(([pairingIndex,seedIndex,leg,teamZero,teamOne,outcome,endFrame,digest,engineOutcome],index) => ({index,pairingIndex,seedIndex,leg,teamZero,teamOne,outcome,endFrame,digest,engineOutcome}));
for(const battle of battles) pairingByIndex[battle.pairingIndex].battles.push(battle);
let selectedA = standings[0].index, selectedB = standings[1].index;
const number = value => Number(value).toLocaleString('zh-Hant');
const talentBadge = entry => `<span class="talent" data-talent="${escapeHtml(entry.talentId)}">${escapeHtml(entry.talent)}</span>`;
const winRate = s => (100*s.wins/(s.wins+s.draws+s.losses)).toFixed(1)+'%';
el('formatLabel').textContent = '完整循環賽 · '+DATA.seeds.length+' 組共用種子 · 交換雙方位置';
el('rulesLabel').textContent = DATA.meta.difficulty+' · 最高總分相同者並列 · 超時由玩家 1 獲勝';
el('versionLabel').textContent = 'OFFLINE ARENA / '+DATA.meta.gameVersion;
el('rootSeed').textContent = DATA.meta.tournamentSeed;
el('entrantCount').textContent = number(submissions.size);
el('pairingCount').textContent = number(pairings.size);
el('battleCount').textContent = number(battles.length);
el('perEntrant').textContent = number((submissions.size-1)*DATA.seeds.length*2);
el('footerVersion').textContent = '金群自走棋 '+DATA.meta.gameVersion+' · 可離線檢視';
el('sourceLabel').textContent = '資料來源：'+DATA.meta.sourceJson;
el('podium').innerHTML = standings.slice(0,3).map(s => { const e=submissions.get(s.index); return `<article class="podium-card"><div class="podium-top"><span>${s.rank===1?(DATA.champions.length>1?'並列冠軍':'冠軍'):'第 '+s.rank+' 名'}</span><span>#${String(s.rank).padStart(2,'0')}</span></div><div class="podium-name">${escapeHtml(e.name)}</div><div class="podium-bottom">${talentBadge(e)}<span>${s.wins} 勝 · ${s.losses} 敗</span><span>${winRate(s)}</span></div></article>`; }).join('');
const talentIds = [...new Set(DATA.submissions.map(s => s[5]))];
for(const id of talentIds) { const entries=DATA.submissions.filter(s=>s[5]===id); const option=document.createElement('option'); option.value=id; option.textContent=entries[0][4]+' · '+entries.length; el('talentFilter').append(option); }
for(const s of standings) { const e=submissions.get(s.index); const option=document.createElement('option'); option.value=s.index; option.textContent=`#${s.rank} ${e.name} · ${e.talent}`; el('entrantA').append(option); el('entrantB').append(option.cloneNode(true)); }
function renderStandings() {
const query=el('search').value.trim().toLocaleLowerCase('zh-Hant'); const talent=el('talentFilter').value;
const rows=standings.filter(s=>{const e=submissions.get(s.index);return e.name.toLocaleLowerCase('zh-Hant').includes(query)&&(talent==='all'||e.talentId===talent);});
rows.sort((a,b)=>el('sort').value==='name'?submissions.get(a.index).name.localeCompare(submissions.get(b.index).name,'zh-Hant'):el('sort').value==='losses'?a.losses-b.losses||a.rank-b.rank:a.rank-b.rank||a.index-b.index);
el('rowCount').textContent=rows.length+' / '+submissions.size+' 份陣容';
el('standingRows').innerHTML=rows.map(s=>{const e=submissions.get(s.index);return `<tr class="${s.rank<=3?'top-three':''}"><td class="rank">${String(s.rank).padStart(2,'0')}</td><td class="name"><button class="choose" data-entrant="${s.index}" type="button">${escapeHtml(e.name)}</button></td><td>${talentBadge(e)}</td><td class="num">${escapeHtml(s.points)}</td><td class="num">${s.wins}</td><td class="num">${s.losses}</td><td class="num">${winRate(s)}<div class="bar" aria-hidden="true"><span style="width:${winRate(s)}"></span></div></td></tr>`;}).join('')||'<tr><td class="empty" colspan="7">沒有符合條件的陣容</td></tr>';
}
function command(battle) {
const pair=pairingByIndex[battle.pairingIndex];const first=submissions.get(pair.first),second=submissions.get(pair.second);const quote=value=>"'"+String(value).replaceAll("'","''")+"'";
return '& '+quote(DATA.meta.cliPath)+' tournament-battle '+quote(DATA.meta.saveDirectory+'\\'+first.source)+' '+quote(DATA.meta.saveDirectory+'\\'+second.source)+' --seed '+quote(DATA.meta.tournamentSeed)+' --seed-index '+battle.seedIndex+' --leg '+battle.leg+' --data-root '+quote(DATA.meta.dataRoot)+' --config-root '+quote(DATA.meta.configRoot)+' --json';
}
function matchupFor(entrant,opponent) {
const first=Math.min(entrant,opponent),second=Math.max(entrant,opponent);const pair=pairings.get(`${first}:${second}`);
const points=entrant===first?pair.firstPoints:pair.secondPoints,opponentPoints=entrant===first?pair.secondPoints:pair.firstPoints;
const wins=pair.battles.filter(b=>b.outcome===(b.teamZero===entrant?0:1)).length,draws=pair.battles.filter(b=>b.outcome===2).length;
return {pair,points,opponentPoints,wins,draws,losses:pair.battles.length-wins-draws};
}
function renderOpponentSummary() {
const entrant=submissions.get(selectedA),standing=standingMap.get(selectedA);
el('opponentTitle').textContent=entrant.name+' · 全部對手';
el('opponentSummary').textContent=(submissions.size-1)+' 位對手 · '+standing.wins+' 勝 · '+standing.draws+' 和 · '+standing.losses+' 敗';
el('opponentRows').innerHTML=standings.filter(s=>s.index!==selectedA).map(s=>{
const opponent=submissions.get(s.index),result=matchupFor(selectedA,s.index);
return `<tr class="${s.index===selectedB?'selected-opponent':''}"><td class="rank">${String(s.rank).padStart(2,'0')}</td><td class="name"><button class="choose" data-opponent="${s.index}" aria-pressed="${s.index===selectedB}" type="button">${escapeHtml(opponent.name)}</button></td><td>${talentBadge(opponent)}</td><td class="num">${result.points} : ${result.opponentPoints}</td><td class="num">${result.wins}</td><td class="num">${result.draws}</td><td class="num">${result.losses}</td><td class="num">${winRate(result)}</td></tr>`;
}).join('');
}
function renderComparison() {
el('entrantA').value=selectedA;el('entrantB').value=selectedB;for(const option of el('entrantB').options)option.disabled=+option.value===selectedA;
renderOpponentSummary();
const {pair,points:aPoints,opponentPoints:bPoints}=matchupFor(selectedA,selectedB);
const team=(index,label)=>{const e=submissions.get(index),s=standingMap.get(index);return `<div class="compare-team">${talentBadge(e)}<div class="compare-name">${label} · ${escapeHtml(e.name)}</div><div class="compare-meta">第 ${s.rank} 名 · ${s.wins} 勝 ${s.losses} 敗 · ${winRate(s)}</div></div>`;};
el('comparison').innerHTML=team(selectedA,'A')+`<div class="score">${aPoints} — ${bPoints}<small>直接對戰積分</small></div>`+team(selectedB,'B');
el('seedCards').innerHTML=DATA.seeds.map(([seedIndex,seed])=>{const legs=pair.battles.filter(b=>b.seedIndex===seedIndex).sort((a,b)=>(a.teamZero===selectedA?0:1)-(b.teamZero===selectedA?0:1));return `<section class="seed-card"><header class="seed-card-header"><strong>S${seedIndex}</strong><span>${seed}</span></header>${legs.map(b=>{const aTeam=b.teamZero===selectedA?0:1;const win=b.outcome===aTeam;const result=b.outcome===2?'和局':win?'A 勝':'B 勝';return `<details class="battle"><summary><span class="battle-info"><strong>A 擔任玩家 ${aTeam}</strong>${number(b.endFrame)} 幀${b.engineOutcome==='timeout'?' · 超時':''}</span><span class="result ${win?'':'loss'}">${result} ↗</span></summary><div class="battle-body"><div class="digest">SHA256 · ${escapeHtml(b.digest)}</div><pre>${escapeHtml(command(b))}</pre><button class="copy" data-battle="${b.index}" type="button">複製重現指令</button></div></details>`;}).join('')}</section>`;}).join('');
}
el('search').addEventListener('input',renderStandings);el('talentFilter').addEventListener('change',renderStandings);el('sort').addEventListener('change',renderStandings);
const scrollToSection=id=>el(id).scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
function selectEntrant(index) {selectedA=index;if(selectedA===selectedB)selectedB=standings.find(s=>s.index!==selectedA).index;renderComparison();}
el('standingRows').addEventListener('click',event=>{const button=event.target.closest('[data-entrant]');if(!button)return;selectEntrant(+button.dataset.entrant);scrollToSection('matchups');});
el('entrantA').addEventListener('change',()=>selectEntrant(+el('entrantA').value));
el('opponentRows').addEventListener('click',event=>{const button=event.target.closest('[data-opponent]');if(!button)return;selectedB=+button.dataset.opponent;renderComparison();scrollToSection('matchDetails');});
el('entrantB').addEventListener('change',()=>{selectedB=+el('entrantB').value;renderComparison();});
el('seedCards').addEventListener('click',async event=>{const button=event.target.closest('[data-battle]');if(!button)return;const text=command(battles[+button.dataset.battle]);try{await navigator.clipboard.writeText(text);el('copyStatus').textContent='已複製重現指令';}catch{const pre=button.previousElementSibling;const range=document.createRange();range.selectNodeContents(pre);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);el('copyStatus').textContent='已選取指令，可直接複製';}});
renderStandings();renderComparison();
</script>
</body>
</html>
