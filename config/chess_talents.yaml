棋手天賦:
  神兵:
    說明: 獲得更多、更高階的裝備獎勵，並可在終局開啟神兵商店
    可使用神兵商店: true
  晚成:
    說明: 每局選定一枚持有棋子，達到三星與30勝後突破四星；低費棋子突破後獲得開場狀態護盾
    突破勝場: 30
    提醒剩餘戰鬥: 35
    各費開場狀態護盾: [800, 400, 200, 0, 0]
  賭徒:
    說明: 每次付費刷新商店，只隨機為一枚符合條件的棋子增加賭運，優先上場棋子；賭運越多，致命傷害時免死機率越高
    開局額外禁棋:
      次數: 8
      最低費用: 1
      最高費用: 2
    賭運:
      累積截止關卡: 20
      目標最低費用: 1
      目標最高費用: 3
      每次增加層數: 1
      每層觸發機率百分點: 20
      層數上限: 5
      觸發後生命: 1
      無敵幀數: 120
  中堅:
    說明: 非三費友軍的額外星級提供三費棋子開場內力及攻防各自獨立的強化次數，三費棋子升至二星後下次商店必刷新
    目標費用: 3
    額外星級加成:
      每顆開場內力: 14
      每顆強化次數: 1
      強化傷害百分比: 60
      計算上限: 7
    刷新保證:
      觸發星級: 2
      每次數量: 1
  合縱:
    說明: 開局選擇一個羈絆永久加點，所有高階羈絆提前啟用
    開局羈絆加點: 1
    高階門檻:
      最低門檻: 6
      降低人數: 1
